<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#e8e9e7">
<title>SUKIVA</title>
<meta name="description" content="SUKIVA: ropa deportiva original con existencia real, precios y tallas actualizados.">
<link rel="preconnect" href="https://zrjhwthvbsyumzcilqnh.supabase.co" crossorigin>
<link rel="preload" href="anybody.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="store.css?v=10">
</head>
<body>
<header class="bar" id="bar">
  <a class="brand" href="#top" id="brand" aria-label="Inicio">SUKIVA</a>
  <nav class="bar-actions" aria-label="Principal">
    <a class="bar-link" href="#prendas">Prendas</a>
    <button class="bar-link" id="openBag" type="button" aria-haspopup="dialog">Mi solicitud <span class="count" id="bagCount" hidden>0</span></button>
  </nav>
</header>

<main id="top">
  <section class="hero" id="hero" aria-label="Portada">
    <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
    <div class="hero-type">
      <h1 id="heroName">SUKIVA</h1>
      <div class="hero-foot">
        <p id="heroLine">Ropa deportiva original, con existencia real.</p>
        <a class="pill solid" href="#prendas">Ver prendas</a>
      </div>
    </div>
  </section>

  <section class="bento" id="bento" aria-label="Colecciones y condiciones"></section>

  <section class="shop" id="prendas">
    <div class="shop-head">
      <h2>Prendas</h2>
      <p class="muted" id="shopCount"></p>
    </div>
    <div class="filters" id="filters">
      <div class="chips" id="cats" role="tablist" aria-label="Categorías"></div>
      <input id="search" type="search" placeholder="Buscar prenda o color" aria-label="Buscar prenda o color" autocomplete="off">
    </div>
    <div class="look" id="grid" aria-live="polite"></div>
    <p class="empty" id="empty" hidden></p>
  </section>

  <section class="terms" id="politicas" hidden>
    <h2>Condiciones</h2>
    <div id="policies"></div>
  </section>
</main>

<footer class="foot">
  <div class="foot-grid">
    <div id="contact"></div>
    <div class="foot-links">
      <a href="#prendas">Prendas</a>
      <a href="#politicas" id="footPol" hidden>Condiciones</a>
    </div>
  </div>
  <p class="foot-mark" id="footMark" aria-hidden="true">SUKIVA</p>
  <p class="muted small" id="updated"></p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="bag" id="bag" role="dialog" aria-modal="true" aria-label="Mi solicitud" hidden></aside>
<div class="pdp" id="pdp" role="dialog" aria-modal="true" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="common.js?v=10"></script>
<script src="store.js?v=10"></script>
</body>
</html>
